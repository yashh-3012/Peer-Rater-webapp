<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="prBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="prStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="prAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="prGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#312e81" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Container with glow -->
  <rect width="100" height="100" rx="26" fill="url(#prBgGrad)" filter="url(#prGlow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="2" y="2" width="96" height="96" rx="24" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />

  <!-- Background geometric overlay for depth -->
  <circle cx="78" cy="22" r="18" fill="rgba(255, 255, 255, 0.08)" />
  <circle cx="20" cy="80" r="14" fill="rgba(255, 255, 255, 0.06)" />

  <!-- Stylized Interconnected Peer Network & "P" Emblem -->
  <!-- Connecting track -->
  <path d="M32 72V28C32 28 44 24 58 24C70 24 76 31 76 40C76 49 68 55 56 55H32" 
        stroke="url(#prAccentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Horizontal connector node line -->
  <line x1="32" y1="55" x2="68" y2="72" stroke="rgba(255, 255, 255, 0.5)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />

  <!-- Peer rating nodes -->
  <!-- Top Node (Leader) -->
  <circle cx="32" cy="28" r="6.5" fill="#ffffff" stroke="#4f46e5" stroke-width="3" />
  <!-- Center Loop Node -->
  <circle cx="76" cy="40" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5" />
  <!-- Bottom Node (Member) -->
  <circle cx="32" cy="72" r="6" fill="#ffffff" stroke="#6366f1" stroke-width="3" />
  <!-- Right Branch Node (Rater / Metric) -->
  <circle cx="68" cy="72" r="7" fill="url(#prStarGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Star Icon inside the rating node -->
  <path d="M68 68.2L69.2 70.6L71.8 71L69.9 72.8L70.4 75.4L68 74.1L65.6 75.4L66.1 72.8L64.2 71L66.8 70.6Z" fill="#78350f" />
</svg>
